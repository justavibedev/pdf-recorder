name: PDFRecorder
options:
  projectFormat: xcode15_0
  xcodeVersion: "15.0"
  bundleIdPrefix: org.pdfrecorder
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
targets:
  PDFRecorderCore:
    type: framework
    platform: macOS
    sources: [Sources/PDFRecorderCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.pdfrecorder.core
        MACH_O_TYPE: staticlib
  PDFRecorder:
    type: application
    platform: macOS
    productName: PDF Recorder
    sources:
      - Sources/PDFRecorderApp
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - target: PDFRecorderCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pdfrecorder.app
        PRODUCT_NAME: PDF Recorder
        INFOPLIST_FILE: Sources/PDFRecorderApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PDFRecorderApp/PDFRecorder.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PDFRecorder:
    build:
      targets:
        PDFRecorder: all
